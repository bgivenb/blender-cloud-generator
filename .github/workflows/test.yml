name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_addon.py

  blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install distro Blender and virtual display
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y blender xvfb xauth
          blender --version
      - name: Check Cycles after a factory-scene reset
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          xvfb-run -a blender --background --factory-startup --python-exit-code 1 --python-expr
          "import bpy; bpy.ops.wm.read_factory_settings(); s = bpy.context.scene; s.render.engine = 'CYCLES'; s.cycles.device = 'CPU'; s.cycles.samples = 1; s.cycles.use_denoising = False; s.render.resolution_x = s.render.resolution_y = 32; s.render.resolution_percentage = 100; bpy.ops.render.render()"
      - name: Exercise Blender behavior and failure recovery
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a python3 scripts/run_blender_tests.py
      - name: Build and verify installable package
        run: |
          python3 scripts/package_addon.py
          blender --background --factory-startup --python-exit-code 1 --python scripts/verify_package.py
      - name: Report native Blender crash details
        if: failure()
        run: |
          if [ -f /tmp/blender.crash.txt ]; then
            sed -n '1,220p' /tmp/blender.crash.txt
          fi
      - name: Isolate source visibility flags
        if: failure()
        run: |
          for mode in viewport render rays transparent; do
            blender --background --factory-startup --python-exit-code 1 --python scripts/diagnose_volume.py -- "$mode" || echo "Native volume diagnostic failed: $mode"
          done
